server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API. The trailing slash on proxy_pass strips the /api prefix, so
    # /api/files reaches the backend as /files.
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx caps request bodies at 1 MB by default, which would reject
        # every upload worth making on a file server. 0 disables the limit.
        client_max_body_size 0;

        # Big uploads and downloads on a home LAN can be slow; don't cut them
        # off mid-transfer.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_request_buffering off;
    }

    # SPA fallback: /trash is a client-side route with no file behind it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}